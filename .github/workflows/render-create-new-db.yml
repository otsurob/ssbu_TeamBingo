name: GitHub Actions renderDB自動際作成

on:
  workflow_dispatch:
    inputs:
      message:
        description: 実行結果に表示するメッセージ
        required: false
        default: Hello from GitHub Actions!
        type: string
  schedule:
    - cron: "0 10 * * 0"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: recreate-render-postgres
  cancel-in-progress: false

jobs:
  actions-demo:
    name: 動作確認
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 実行情報をログに表示
        env:
          INPUT_MESSAGE: ${{ inputs.message || '定期スケジュールで起動しました' }}
        run: |
          echo "GitHub Actionsが正常に起動しました"
          echo "メッセージ: ${INPUT_MESSAGE}"
          echo "実行ユーザー: ${GITHUB_ACTOR}"
          echo "ブランチ: ${GITHUB_REF_NAME}"
          echo "コミット: ${GITHUB_SHA}"
          echo "Runner OS: ${RUNNER_OS}"

      - name: Job Summaryを作成
        env:
          INPUT_MESSAGE: ${{ inputs.message || '定期スケジュールで起動しました' }}
        run: |
          {
            echo "# ✅ GitHub Actions 動作確認成功"
            echo
            echo "| 項目 | 結果 |"
            echo "| --- | --- |"
            echo "| メッセージ | ${INPUT_MESSAGE} |"
            echo "| 実行ユーザー | ${GITHUB_ACTOR} |"
            echo "| ブランチ | ${GITHUB_REF_NAME} |"
            echo "| Runner OS | ${RUNNER_OS} |"
            echo
            echo "次は、このWorkflowにRender APIの読み取り確認を追加できます。"
          } >> "${GITHUB_STEP_SUMMARY}"

  inspect_database:
    name: 既存DB確認
    needs: actions-demo
    runs-on: ubuntu-latest

    outputs:
      postgres_count: ${{ steps.find_database.outputs.postgres_count }}
      postgres_id: ${{ steps.find_database.outputs.postgres_id }}
      postgres_db: ${{ steps.find_database.outputs.postgres_db }}
      should_recreate: ${{ steps.find_database.outputs.should_recreate }}

    steps:
      - name: Render上の既存DBを確認
        id: find_database
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::GitHub Actions SecretのRENDER_API_KEYが未設定です"
            exit 1
          fi

          postgres_list="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request GET \
              --url "https://api.render.com/v1/postgres?limit=100" \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${RENDER_API_KEY}"
          )"

          postgres_count="$(jq 'length' <<< "${postgres_list}")"

          echo "postgres_count=${postgres_count}" >> "${GITHUB_OUTPUT}"

          if [ "${postgres_count}" -gt 1 ]; then
            echo "::error::Render上のPostgresが複数個あります: ${postgres_count}個"
            exit 1
          fi

          if [ "${postgres_count}" -eq 1 ]; then
            render_postgres_db="$(jq -r '.[0].postgres.databaseName // empty' <<< "${postgres_list}")"
            render_postgres_id="$(jq -r '.[0].postgres.id // empty' <<< "${postgres_list}")"
            render_postgres_expires_at="$(jq -r '.[0].postgres.expiresAt // empty' <<< "${postgres_list}")"

            if [ -z "${render_postgres_db}" ] || [ -z "${render_postgres_id}" ]; then
              echo "::error::Render上のPostgres情報を取得できませんでした"
              exit 1
            fi

            echo "既存DBのdatabaseName: ${render_postgres_db}"
            echo "既存DBのPostgres ID: ${render_postgres_id}"

            echo "postgres_id=${render_postgres_id}" >> "${GITHUB_OUTPUT}"
            echo "postgres_db=${render_postgres_db}" >> "${GITHUB_OUTPUT}"

            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              should_recreate="true"
              recreate_reason="手動実行"
            else
              if [ -z "${render_postgres_expires_at}" ]; then
                echo "::error::PostgresのexpiresAtを取得できませんでした"
                exit 1
              fi

              expires_at_epoch="$(date -d "${render_postgres_expires_at}" +%s)"
              current_epoch="$(date -u +%s)"
              remaining_seconds="$((expires_at_epoch - current_epoch))"
              remaining_days="$(((remaining_seconds + 86399) / 86400))"

              if [ "${remaining_seconds}" -le 432000 ]; then
                should_recreate="true"
                recreate_reason="有効期限まで${remaining_days}日"
              else
                should_recreate="false"
                recreate_reason="有効期限まで${remaining_days}日あるため見送り"
              fi
            fi

            echo "should_recreate=${should_recreate}" >> "${GITHUB_OUTPUT}"
            echo "再作成判定: ${recreate_reason}"

            {
              echo
              echo "## Render上の既存DB"
              echo
              echo "| 項目 | 値 |"
              echo "| --- | --- |"
              echo "| \`databaseName\` | \`${render_postgres_db}\` |"
              echo "| RenderのPostgres ID | \`${render_postgres_id}\` |"
              echo "| 有効期限 | \`${render_postgres_expires_at:-未取得}\` |"
              echo "| 再作成判定 | \`${should_recreate}\`（${recreate_reason}） |"
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "データベースが存在しませんでした。"
            echo "should_recreate=true" >> "${GITHUB_OUTPUT}"

            {
              echo "データベースが存在しませんでした"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  delete_database:
    name: 既存DB削除
    needs: inspect_database
    runs-on: ubuntu-latest

    steps:
      - name: 既存のRender PostgreSQLを削除
        if: >-
          needs.inspect_database.outputs.should_recreate == 'true' &&
          needs.inspect_database.outputs.postgres_count == '1'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          POSTGRES_ID: ${{ needs.inspect_database.outputs.postgres_id }}
          POSTGRES_DB: ${{ needs.inspect_database.outputs.postgres_db }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::GitHub Actions SecretのRENDER_API_KEYが未設定です"
            exit 1
          fi

          echo "削除対象DB: ${POSTGRES_DB}"
          echo "削除対象ID: ${POSTGRES_ID}"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request DELETE \
            --url "https://api.render.com/v1/postgres/${POSTGRES_ID}" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${RENDER_API_KEY}"

          echo "Render PostgreSQLを削除しました"

          {
            echo
            echo "## Render DBの削除結果"
            echo
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| DB名 | \`${POSTGRES_DB}\` |"
            echo "| Postgres ID | \`${POSTGRES_ID}\` |"
            echo "| 削除結果 | ✅ 成功 |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 既存DB削除をスキップ
        if: >-
          needs.inspect_database.outputs.should_recreate == 'true' &&
          needs.inspect_database.outputs.postgres_count == '0'
        run: |
          echo "既存DBがないため削除をスキップしました"

          {
            echo
            echo "## Render DBの削除結果"
            echo
            echo "既存DBがないため削除をスキップしました。"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 今回のDB再作成を見送る
        if: needs.inspect_database.outputs.should_recreate != 'true'
        run: |
          echo "有効期限まで余裕があるため、DB再作成を見送ります"

  create_database:
    name: 新DB作成
    needs:
      - inspect_database
      - delete_database
    runs-on: ubuntu-latest

    outputs:
      postgres_id: ${{ steps.create_database.outputs.postgres_id }}

    steps:
      - name: 既存DBの削除完了を待機
        if: needs.inspect_database.outputs.should_recreate == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            postgres_list="$(
              curl \
                --fail-with-body \
                --silent \
                --show-error \
                --request GET \
                --url "https://api.render.com/v1/postgres?limit=100" \
                --header "Accept: application/json" \
                --header "Authorization: Bearer ${RENDER_API_KEY}"
            )"

            postgres_count="$(jq 'length' <<< "${postgres_list}")"

            if [ "${postgres_count}" -eq 0 ]; then
              echo "新しいPostgresを作成できる状態になりました"
              break
            fi

            if [ "${attempt}" -eq 30 ]; then
              echo "::error::既存Postgresの削除完了を確認できませんでした"
              exit 1
            fi

            echo "既存Postgresの削除完了を待っています: ${attempt}/30"
            sleep 10
          done

      - name: 新しいRender PostgreSQLを作成
        id: create_database
        if: needs.inspect_database.outputs.should_recreate == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          POSTGRES_NAME: ssbu-team-bingo-db
          POSTGRES_DATABASE_NAME: ssbu_team_bingo
          POSTGRES_DATABASE_USER: ssbu_team_bingo_user
          POSTGRES_REGION: singapore
          POSTGRES_VERSION: "16"
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::GitHub Actions SecretのRENDER_API_KEYが未設定です"
            exit 1
          fi

          if [ -z "${RENDER_OWNER_ID:-}" ]; then
            echo "::error::GitHub Actions VariableのRENDER_OWNER_IDが未設定です"
            exit 1
          fi

          request_body="$(
            jq -n \
              --arg name "${POSTGRES_NAME}" \
              --arg owner_id "${RENDER_OWNER_ID}" \
              --arg database_name "${POSTGRES_DATABASE_NAME}" \
              --arg database_user "${POSTGRES_DATABASE_USER}" \
              --arg region "${POSTGRES_REGION}" \
              --arg version "${POSTGRES_VERSION}" \
              '{
                name: $name,
                ownerId: $owner_id,
                databaseName: $database_name,
                databaseUser: $database_user,
                plan: "free",
                region: $region,
                version: $version
              }'
          )"

          create_response="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --url "https://api.render.com/v1/postgres" \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "${request_body}"
          )"

          new_postgres_id="$(jq -r '.id // empty' <<< "${create_response}")"

          if [ -z "${new_postgres_id}" ]; then
            echo "::error::新しいPostgresのIDを取得できませんでした"
            exit 1
          fi

          echo "postgres_id=${new_postgres_id}" >> "${GITHUB_OUTPUT}"
          echo "新しいRender PostgreSQLを作成しました: ${new_postgres_id}"

          {
            echo
            echo "## Render DBの作成結果"
            echo
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| Render上の名前 | \`${POSTGRES_NAME}\` |"
            echo "| DB名 | \`${POSTGRES_DATABASE_NAME}\` |"
            echo "| Postgres ID | \`${new_postgres_id}\` |"
            echo "| リージョン | \`${POSTGRES_REGION}\` |"
            echo "| PostgreSQLバージョン | \`${POSTGRES_VERSION}\` |"
            echo "| プラン | \`free\` |"
            echo "| 作成結果 | ✅ 成功 |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 新DB作成をスキップ
        if: needs.inspect_database.outputs.should_recreate != 'true'
        run: |
          echo "再作成条件を満たしていないため、新DB作成をスキップしました"

  update_backend_env:
    name: バックエンド環境変数更新
    needs:
      - inspect_database
      - create_database
    runs-on: ubuntu-latest

    steps:
      - name: 新DBの接続情報でバックエンド環境変数を更新
        if: needs.inspect_database.outputs.should_recreate == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          NEW_POSTGRES_ID: ${{ needs.create_database.outputs.postgres_id }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::GitHub Actions SecretのRENDER_API_KEYが未設定です"
            exit 1
          fi

          if [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "::error::GitHub Actions VariableのRENDER_SERVICE_IDが未設定です"
            exit 1
          fi

          if [ -z "${NEW_POSTGRES_ID:-}" ]; then
            echo "::error::新しいPostgres IDが取得できませんでした"
            exit 1
          fi

          postgres_status=""
          postgres_detail=""

          for attempt in $(seq 1 60); do
            postgres_detail="$(
              curl \
                --fail-with-body \
                --silent \
                --show-error \
                --request GET \
                --url "https://api.render.com/v1/postgres/${NEW_POSTGRES_ID}" \
                --header "Accept: application/json" \
                --header "Authorization: Bearer ${RENDER_API_KEY}"
            )"

            postgres_status="$(jq -r '.status // empty' <<< "${postgres_detail}")"

            if [ "${postgres_status}" = "available" ]; then
              echo "新しいPostgresが利用可能になりました"
              break
            fi

            if [ "${attempt}" -eq 60 ]; then
              echo "::error::新しいPostgresが利用可能になりませんでした: ${postgres_status:-unknown}"
              exit 1
            fi

            echo "新しいPostgresの作成完了を待っています: ${postgres_status:-unknown} (${attempt}/60)"
            sleep 10
          done

          postgres_user="$(jq -r '.databaseUser // empty' <<< "${postgres_detail}")"
          postgres_db="$(jq -r '.databaseName // empty' <<< "${postgres_detail}")"
          connection_info=""

          for attempt in $(seq 1 30); do
            if connection_info="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --request GET \
                --url "https://api.render.com/v1/postgres/${NEW_POSTGRES_ID}/connection-info" \
                --header "Accept: application/json" \
                --header "Authorization: Bearer ${RENDER_API_KEY}"
            )"; then
              internal_url="$(jq -r '.internalConnectionString // empty' <<< "${connection_info}")"
              postgres_password="$(jq -r '.password // empty' <<< "${connection_info}")"

              if [ -n "${internal_url}" ] && [ -n "${postgres_password}" ]; then
                break
              fi
            fi

            connection_info=""

            if [ "${attempt}" -eq 30 ]; then
              echo "::error::新しいPostgresの接続情報を取得できませんでした"
              exit 1
            fi

            echo "新しいPostgresの接続情報を待っています: ${attempt}/30"
            sleep 10
          done

          echo "::add-mask::${internal_url}"
          echo "::add-mask::${postgres_password}"

          postgres_host="$(
            node -e '
              const url = new URL(process.argv[1]);
              process.stdout.write(url.hostname);
            ' "${internal_url}"
          )"

          postgres_port="$(
            node -e '
              const url = new URL(process.argv[1]);
              process.stdout.write(url.port || "5432");
            ' "${internal_url}"
          )"

          if [ -z "${postgres_user}" ] ||
            [ -z "${postgres_password}" ] ||
            [ -z "${postgres_host}" ] ||
            [ -z "${postgres_port}" ] ||
            [ -z "${postgres_db}" ]; then
            echo "::error::バックエンドへ設定するDB接続情報が不足しています"
            exit 1
          fi

          POSTGRES_USER="${postgres_user}"
          POSTGRES_PW="${postgres_password}"
          POSTGRES_HOST="${postgres_host}"
          POSTGRES_PORT="${postgres_port}"
          POSTGRES_DB="${postgres_db}"

          env_keys=(
            POSTGRES_USER
            POSTGRES_PW
            POSTGRES_HOST
            POSTGRES_PORT
            POSTGRES_DB
          )

          for key in "${env_keys[@]}"; do
            value="${!key}"

            request_body="$(
              jq -n \
                --arg value "${value}" \
                '{value: $value}'
            )"

            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request PUT \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${key}" \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "${request_body}" \
              > /dev/null

            echo "${key}を更新しました"
          done

          {
            echo
            echo "## バックエンド環境変数の更新結果"
            echo
            echo "| 環境変数 | 結果 |"
            echo "| --- | --- |"
            echo "| \`POSTGRES_USER\` | ✅ 更新 |"
            echo "| \`POSTGRES_PW\` | ✅ 更新 |"
            echo "| \`POSTGRES_HOST\` | ✅ 更新 |"
            echo "| \`POSTGRES_PORT\` | ✅ 更新 |"
            echo "| \`POSTGRES_DB\` | ✅ 更新 |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 環境変数更新をスキップ
        if: needs.inspect_database.outputs.should_recreate != 'true'
        run: |
          echo "DBを再作成していないため、環境変数更新をスキップしました"

  deploy_backend:
    name: バックエンド再デプロイ
    needs:
      - inspect_database
      - update_backend_env
    runs-on: ubuntu-latest

    steps:
      - name: バックエンドを再デプロイ
        if: needs.inspect_database.outputs.should_recreate == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::GitHub Actions SecretのRENDER_API_KEYが未設定です"
            exit 1
          fi

          if [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "::error::GitHub Actions VariableのRENDER_SERVICE_IDが未設定です"
            exit 1
          fi

          deploy_response="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data '{"deployMode":"build_and_deploy"}'
          )"

          deploy_id="$(jq -r '.id // empty' <<< "${deploy_response}")"

          if [ -z "${deploy_id}" ]; then
            echo "::error::バックエンドのDeploy IDを取得できませんでした"
            exit 1
          fi

          echo "バックエンドの再デプロイを開始しました: ${deploy_id}"

          deploy_status=""

          for attempt in $(seq 1 60); do
            deploy_detail="$(
              curl \
                --fail-with-body \
                --silent \
                --show-error \
                --request GET \
                --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}" \
                --header "Accept: application/json" \
                --header "Authorization: Bearer ${RENDER_API_KEY}"
            )"

            deploy_status="$(jq -r '.status // empty' <<< "${deploy_detail}")"

            case "${deploy_status}" in
              live)
                echo "バックエンドの再デプロイが完了しました"
                break
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::バックエンドの再デプロイに失敗しました: ${deploy_status}"
                exit 1
                ;;
            esac

            if [ "${attempt}" -eq 60 ]; then
              echo "::error::バックエンドの再デプロイ完了を確認できませんでした: ${deploy_status:-unknown}"
              exit 1
            fi

            echo "バックエンドの再デプロイを待っています: ${deploy_status:-unknown} (${attempt}/60)"
            sleep 10
          done

          {
            echo
            echo "## バックエンド再デプロイ結果"
            echo
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| Deploy ID | \`${deploy_id}\` |"
            echo "| Deployモード | \`build_and_deploy\` |"
            echo "| ステータス | ✅ \`${deploy_status}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 再デプロイをスキップ
        if: needs.inspect_database.outputs.should_recreate != 'true'
        run: |
          echo "DBを再作成していないため、バックエンド再デプロイをスキップしました"
